# /etc/logrotate.d/okrich-containers
#
# Retention for the container logs on the host (owner's decision, 2026-09-03): keep the nginx
# access log with client addresses long enough to react to an incident, then delete. No archive.
#
# nginx writes its access log to stdout; Docker's json-file driver stores it under
# /var/lib/docker/containers/<id>/<id>-json.log. That driver rotates by size only, so the
# 14-day limit has to come from logrotate. `copytruncate` is required: Docker keeps the file
# open, moving it away would leave Docker writing into a deleted inode.
#
# Install (needs root):
#   sudo cp /home/deploy/okrich/ops/logrotate-okrich.conf /etc/logrotate.d/okrich-containers
#   sudo logrotate -d /etc/logrotate.d/okrich-containers     # dry run, must print no errors
#   sudo logrotate -f /etc/logrotate.d/okrich-containers     # first rotation, proves it works
# Runs daily through the system's logrotate timer after that (`systemctl status logrotate.timer`).

/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 14
    maxage 14
    missingok
    notifempty
    nocompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}
