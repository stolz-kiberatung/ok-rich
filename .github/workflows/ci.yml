name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, non-secret build values so the env validation passes in CI (spec A8).
  VITE_DOMAIN: ok-rich.com
  VITE_SITE_TITLE: OK RICH
  VITE_PAY_URL: https://checkout.dodopayments.com/buy/pdt_ci_placeholder
  # "Optional, with defaults" in .env.example, but Vite's %VAR% HTML replacement has no
  # fallback of its own: left unset, %VITE_MIN_AMOUNT% and %VITE_CURRENCY% end up as literal
  # text in the built /terms page. Match the values .env.example suggests.
  VITE_CURRENCY: EUR
  VITE_MIN_AMOUNT: '5'
  # .invalid is the IANA-reserved TLD for exactly this: a syntactically valid https:// URL that
  # is guaranteed never to resolve. Needed so tests/e2e/smoke.spec.ts's "growing contributors
  # board" test has something for its page.route('**/okrich-stats*') mock to intercept — with
  # VITE_STATS_URL empty, src/stats.ts loadStats() returns null before ever calling fetch, so
  # the mock is never hit and the board never renders. This was the one CI failure on every run
  # since 2026-08-31, reproduced and confirmed locally on 2026-09-02.
  VITE_STATS_URL: https://stats.ci.invalid/webhook/okrich-stats

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage gate
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      - name: CycloneDX SBOM
        # No runtime dependencies exist, so the SBOM records the build toolchain (dev deps included).
        # Pinned to an exact version, not to `@6`: everything else in this job comes from the
        # lockfile, and a floating major was the one package the CI runner would fetch and execute
        # without anyone having seen it. Bump it deliberately.
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Lighthouse (non-blocking on shared runners)
        run: npm run audit:lighthouse
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: reports/lighthouse.html
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          --build-arg VITE_DOMAIN="$VITE_DOMAIN"
          --build-arg VITE_SITE_TITLE="$VITE_SITE_TITLE"
          --build-arg VITE_PAY_URL="$VITE_PAY_URL"
          --build-arg VITE_CURRENCY="$VITE_CURRENCY"
          --build-arg VITE_MIN_AMOUNT="$VITE_MIN_AMOUNT"
          --build-arg VITE_STATS_URL="$VITE_STATS_URL"
          -t okrich-web:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --rm --name okrich-ci -p 8080:8080 --read-only --tmpfs /tmp okrich-web:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -sSf -o /dev/null http://localhost:8080/
          curl -sSf -o /dev/null http://localhost:8080/pay
          curl -sSf -o /dev/null http://localhost:8080/thanks
          curl -sSf -o /dev/null http://localhost:8080/terms
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = "404"
          curl -sI http://localhost:8080/ | grep -i "content-security-policy"
          # Every location must carry the full header set, not just the HTML one. /favicon.svg was
          # live for days with no CSP and no X-Frame-Options because `add_header` inside an nginx
          # location drops everything inherited from the server block (found 2026-09-05).
          # Written on single lines on purpose: prettier reflows backslash continuations in this
          # file and silently glues them together.
          HEADERS="content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy cross-origin-opener-policy cross-origin-resource-policy"
          for path in / /pay /favicon.svg /robots.txt /404-does-not-exist; do
            out="$(curl -sI "http://localhost:8080$path")"
            for header in $HEADERS; do
              echo "$out" | grep -qi "^$header:" || { echo "MISSING $header on $path"; echo "$out"; exit 1; }
            done
          done
          docker stop okrich-ci
